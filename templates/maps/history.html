{% extends "layouts/base.html" %}
{% block content %}
<h2 class="mb-4">Seu Histórico de Mapas Mentais</h2>

<div class="card shadow-sm p-3">
    <table class="table table-hover align-middle">
        <thead>
            <tr>
                <th>Título</th>
                <th>Data de Criação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for map in maps %}
            <tr>
                <td><strong>{{ map.title }}</strong></td>
                <td>{{ map.created_at.strftime('%d/%m/%Y às %H:%M') }}</td>
                <td>
                    <a href="{{ url_for('maps.view_map', map_id=map.id) }}" class="btn btn-sm btn-info text-white">Visualizar</a>
                    <form action="{{ url_for('maps.delete_map', map_id=map.id) }}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza?')">Excluir</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" class="text-center py-4 text-muted">Nenhum mapa interativo encontrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
